name: Daily Stock Signal
on:
  schedule:
    - cron: '0 14 * * 1-5' # 13:00 early close + 1 hour
      timezone: America/New_York
    - cron: '0 17 * * 1-5' # regular close +1h or early close +4h
      timezone: America/New_York
    - cron: '0 20 * * 1-5' # regular close +4h
      timezone: America/New_York
    - cron: '0 21 * * 1-5' # early close +8h
      timezone: America/New_York
    - cron: '0 0 * * 2-6' # regular close +8h (next NY day, including Saturday)
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-signal
  cancel-in-progress: false

jobs:
  market-hours:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      final: ${{ steps.check.outputs.final }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check close +1/+4/+8 hours and pending data
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python -m stock_signal.schedule
  update:
    needs: market-hours
    if: needs.market-hours.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect and build (preserve previous signal on failure)
        id: collect
        continue-on-error: true
        run: python -m stock_signal.app
      - name: Save verified daily state
        if: steps.collect.outputs.signal_ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if [ -f data/comparison.json ]; then git add data/comparison.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update daily stock signal"
            git push
          fi
      - name: Notify private recipients of signal changes
        id: notify
        if: steps.collect.outputs.signal_ready == 'true'
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
        run: python -m stock_signal.notify
      - name: Save notification checkpoint
        if: steps.notify.outcome == 'success'
        run: |
          if [ -f data/notification.json ]; then
            git add data/notification.json
            if ! git diff --cached --quiet; then
              git commit -m "Update notification checkpoint"
              git push
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Vercel deployment identity
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python .github/verify_vercel.py
      - name: Deploy dashboard to Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: '1'
        run: npx --yes vercel@59.11.7 deploy --prod --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
      - name: Report errors or exhausted data retries
        env:
          FINAL_ATTEMPT: ${{ needs.market-hours.outputs.final }}
        run: python -m stock_signal.report
      - name: Report collection failure after publishing status
        if: steps.collect.outcome != 'success' || steps.notify.outcome == 'failure'
        run: exit 1
